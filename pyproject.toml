[project]
name = "soccersim"
version = "0.1.0"
description = "2D continuous-physics soccer simulation for practicing ML/RL"
authors = [
    { name = "Guilherme Vecchi", email = "guilherme.vecchi@zetadados.com.br" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py310"]
